[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alohamini-cartesian"
version = "0.7.0"
description = "AlohaMini 笛卡尔遥操作的独立库：机器人运行时适配协议、能力探测与配置覆盖。"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# lerobot 目前不在 PyPI 上发布（上游只提供 git 仓库安装方式）。
# 使用 runtime extra 之前，请先按 lerobot 上游 README 把 lerobot 装进同一个环境，
# 例如从上游仓库以 editable 方式安装；本文件不声明可解析的 lerobot 分发地址。
#
# 版本区间的依据（取舍见 docs/ADR.md D16）：下限 0.6.1 取自厂商 fork pyproject.toml 的
# `version = "0.6.1"`（上游提交 8a74e0ac「chore(dependencies): Bump lerobot to 0.6.1
# (#3957)」引入；Pi 现场 HEAD ec65318f 同属这条版本线）；上限 <0.7 的依据是上游未承诺
# 语义化版本（classifier 仍为 Development Status :: 3 - Alpha），跨 minor 有破坏性变更
# 先例，故跨 minor 一律未验证、不声明支持。
runtime = ["lerobot>=0.6.1,<0.7"]
yaml = ["PyYAML>=6.0"]
# 需要跑依赖 placo 的数值 IK 用例（tests/test_arm_ik.py、tests/benchmarks/）
# 与离线基准（benchmarks/alohamini_ik）时安装本 extra。
# placo 自 0.10 系列才切到 qpmad QP 后端，本库的数值断言基线按 0.10 定；
# 上限钉在 <0.11，防止再换后端导致数值漂移、把断言变成假失败。
kinematics = ["placo>=0.10.1,<0.11"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/alohamini_cartesian"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "ANN", "D"]
# ANN401：`Any` 是本库对外契约的一部分（观测与动作是异构映射），
# 在这里禁用该规则而不是削弱整个 ANN 规则组。
# D415：本库 docstring 以中文为主，句末用全角「。」；该规则只认半角 . ? !，全是噪音。
# N818：`ConversionUnavailable` 是对外公开的异常名，由设计约定固定为不带 Error 后缀。
ignore = ["ANN401", "D415", "N818"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

# 以下四个文件是从旧仓库（lerobot_alohamini-cartesian-teleop）原样迁入的现场基准脚本与
# 其配套测试（v0.4.0）。迁入原则是语义零改动：断言、字符串、docstring 文字、退出码都不动，
# 只允许 ruff format 的机械换行。因此这里按精确路径做最小豁免，而不是 exclude 整个
# benchmarks/ 目录、也不放宽全局 ignore / select。
# 各码为什么不能靠改代码消除：
# - ANN001/ANN003/ANN201/ANN202/ANN204/ANN205：报在测试夹具、闭包与 helper 签名上；
#   补注解要改测试代码本身（新增类型导入、改参数默认写法），属禁止的语义改动。
#   benchmarks/alohamini_io 两脚本在函数内惰性 import lerobot，夹具签名也随之不带注解。
# - D103/D107：报在 `parse_args`/`main`/`__init__`；这些函数 docstring 的「有无」是
#   旧仓库固定契约的一部分，新增 docstring 文字属于改文案。
# - D403：报在 `"""rtt run: ..."""`，首词是协议字段名 `rtt`；大写会改 docstring 文字。
# - E501：余下 10 处全部是不能再拆的单个字符串字面量或行尾注释（中英文长消息、f-string
#   消息），ruff format 已经把所有可拆的行都拆完了；再拆就要改字符串内容。
[tool.ruff.lint.per-file-ignores]
"benchmarks/alohamini_io/capture_robot_fingerprint.py" = ["D103", "D107", "E501"]
"benchmarks/alohamini_io/measure_latency.py" = ["D103", "D107", "E501"]
"tests/benchmarks/test_capture_robot_fingerprint.py" = ["ANN001", "ANN201", "ANN202", "ANN204"]
"tests/benchmarks/test_measure_latency.py" = [
    "ANN001",
    "ANN003",
    "ANN201",
    "ANN202",
    "ANN204",
    "ANN205",
    "D403",
    "E501",
]
