# 标定代际登记表：一台 AlohaMini 每一代标定一条记录，按登记顺序排列。
#
# 身份判定一律用 calib_id（只由 18 台电机 × id/drive_mode/homing_offset/range_min/
# range_max 这五个字段决定，与电机顺序、字段顺序、输入形状无关）。
# file_sha256 + byte_size 只是溯源辅助：同样的标定值换个字节格式（缩进、键顺序）就是
# 另一个文件哈希，所以不能用它判「是不是同一代」。
#
# 本文件由 identity.calib_id() / file_sha256() 实算生成，禁止手改 calib_id 与 motors：
# 想加一代就跑 tools/calib_register.py（写盘会重写本文件，注释不保留，但记录内容不动）。
# first_seen 不是 datetime 字段而是文本：粒度由登记人决定，可以只到日。
# 统一约定：acknowledged_by 为 null 表示「登记人待现场填写」（两条记录都适用），不是「没人看」。
# 填之前不要用空字符串占位：null 与空串的语义不同，健康检查会把两者原样打出来。

