# 本机（AlohaMini 2 Pro）的现场配置：覆盖 template.yaml，再被环境变量 ALOHAMINI_* 覆盖。
# 已实测事实只用于下方对应字段：双臂设备路径 /dev/am_arm_follower_left → ttyACM0、
# /dev/am_arm_follower_right → ttyACM1。标定文件在 Pi 上：
# /home/pi5/.cache/huggingface/lerobot/calibration/robots/alohamini/AlohaMiniRobot.json
# （证据：/Users/pcoffeep/pi-workspace/alohamini-cartesian-teleop/evidence/s4-20261025/stdout/4.7-calib-20261025T070057Z.log）。
#
# 下方三个数值字段（observation_request_window、watchdog_timeout_ms、max_loop_freq_hz）
# 是机器人侧运行时的实际配置，即 Host 进程生效的那份。本库现场配置按同一口径填写，
# 以便两端一致。本库自己的默认值（1 / 500 / 50）在 configs/template.yaml，两者不是同一份东西。

# 这台机器是 AlohaMini 2 Pro，型号名取自 kinematics/model_specs.py 的合法取值。
robot_model: alohamini2pro
# 已实测：左臂设备路径，指向 ttyACM0。
left_port: /dev/am_arm_follower_left
# 已实测：右臂设备路径，指向 ttyACM1。
right_port: /dev/am_arm_follower_right
# 未实测，留默认值：本机有 20 个 /dev/video* 节点，但没有「相机名 → 设备路径」的实测映射。
cameras: {}
# 现场部署值 3：Pi 上 config_alohamini.py 第 110 行（AlohaMiniHostConfig 源码默认，该项无命令行入口），见 docs/field-ops/10-health-baseline.md 第 4.3 节。
observation_request_window: 3
# 现场部署值 1000：Pi 上 config_alohamini.py 第 122 行，见 docs/field-ops/10-health-baseline.md 第 4.3 节。
watchdog_timeout_ms: 1000
# 现场部署值 50：Pi 上 config_alohamini.py 第 125 行，见 docs/field-ops/10-health-baseline.md 第 4.3 节。
max_loop_freq_hz: 50
